[project]
name = "clamator-over-memory"
version = "0.1.8"
description = "In-process loopback transport for clamator (pre-1.0)."
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Kristof Csillag" }]
dependencies = [
  "clamator-protocol==0.1.8",
  "pydantic>=2.5",
]

[project.urls]
Homepage = "https://github.com/deai-network/clamator"
Repository = "https://github.com/deai-network/clamator"
Issues = "https://github.com/deai-network/clamator/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clamator_over_memory"]
include = ["LICENSE"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "pyproject.toml", "LICENSE"]


[tool.uv.sources]
clamator-protocol = { workspace = true }
