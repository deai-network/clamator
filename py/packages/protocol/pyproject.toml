[project]
name = "clamator-protocol"
version = "0.1.7"
description = "Polyglot RPC protocol layer (pre-1.0; API may break in minor versions)."
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Kristof Csillag" }]
dependencies = ["pydantic>=2.5"]

[project.urls]
Homepage = "https://github.com/deai-network/clamator"
Repository = "https://github.com/deai-network/clamator"
Issues = "https://github.com/deai-network/clamator/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clamator_protocol"]
include = ["LICENSE"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "pyproject.toml", "LICENSE"]

