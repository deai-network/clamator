name: TS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('ts/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Install
        run: cd ts && pnpm install --frozen-lockfile
      - name: Check READMEs verbatim
        continue-on-error: true
        run: node scripts/check-readme-verbatim.mjs
      - name: Lint
        run: cd ts && pnpm -r lint
      - name: Build
        run: cd ts && pnpm -r build
      - name: Test
        run: cd ts && pnpm -r test
